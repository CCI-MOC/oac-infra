- hosts: all
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Set power state for nodes managed by OpenStack
      when: bm_management == "openstack"
      block:
        - name: Get power state
          delegate_to: localhost
          ansible.builtin.command: >-
            openstack baremetal node show {{ node_name }} -f value -c power_state
          register: power_state

        - name: Power off node
          delegate_to: localhost
          when: >-
            power_state.stdout != "power off"
          ansible.builtin.command: >-
            openstack baremetal node power off {{ node_name }}

        - name: Wait for power off
          delegate_to: localhost
          ansible.builtin.command: >-
            openstack baremetal node show {{ node_name }} -f value -c power_state
          register: power_state
          until: >-
            power_state.stdout == "power off"
          retries: 12
          delay: 10

    - name: Set power state for nodes through the BMC (idrac)
      when: bm_management == "bmc" and bmc_type == "idrac"
      block:
        - name: Get power state
          delegate_to: "{{ bmc_addr }}"
          ansible.builtin.raw: racadm serveraction powerstatus
          register: power_state

        - name: Power off node
          delegate_to: "{{ bmc_addr }}"
          when: >-
            "off" not in power_state.stdout|lower
          ansible.builtin.raw: racadm serveraction powerdown

        - name: Wait for power off
          delegate_to: "{{ bmc_addr }}"
          ansible.builtin.raw: racadm serveraction powerstatus
          register: power_state
          until: >-
            "off" in power_state.stdout|lower
          retries: 12
          delay: 10

    - name: Set power state for nodes through the BMC (lenovo)
      when: bm_management == "bmc" and bmc_type == "lenovo"
      block:
        - name: Get power state
          delegate_to: "{{ bmc_addr }}"
          ansible.builtin.raw: power state
          register: power_state

        - name: Power off node
          delegate_to: "{{ bmc_addr }}"
          when: >-
            "off" not in power_state.stdout|lower
          ansible.builtin.raw: power off

        - name: Wait for power off
          delegate_to: "{{ bmc_addr }}"
          ansible.builtin.raw: power state
          register: power_state
          until: >-
            "off" in power_state.stdout|lower
          retries: 12
          delay: 10

    - name: Configure virtual media (idrac)
      when: >
        bmc_type == "idrac"
      delegate_to: "{{ bmc_addr }}"
      ansible.builtin.raw: "{{ item }}"
      register: result
      failed_when: >-
        "error" in result.stdout|lower
      loop:
        - racadm remoteimage -d
        - racadm remoteimage -c -l "{{ boot_image_url }}"
        - racadm set idrac.serverboot.FirstBootDevice VCD-DVD
        - racadm set idrac.serverboot.BootOnce 1

    - name: Configure virtual media (lenovo, rdmount)
      when: bmc_type == "lenovo" and (virtual_media_method | default("rdmount")) == "rdmount"
      block:
        - name: Mount boot image
          delegate_to: "{{ bmc_addr }}"
          ansible.builtin.raw: "{{ item }}"
          register: result
          failed_when: >-
            "[cli]err" in result.stdout|lower
          loop:
            - rdmount -umount
            - rdmount -map -t http -ro -l "{{ boot_image_url }}"
            - rdmount -mount

        - name: Request one-time boot from virtual media
          delegate_to: localhost
          ansible.builtin.uri:
            url: "https://{{ bmc_addr }}/redfish/v1/Systems/1"
            url_username: "{{ bmc_user }}"
            url_password: "{{ bmc_password }}"
            validate_certs: false
            force_basic_auth: true
            method: PATCH
            body_format: json
            body: |
              {
                "Boot": {
                  "BootSourceOverrideTarget": "Cd",
                  "BootSourceOverrideMode": "UEFI",
                  "BootSourceOverrideEnabled": "Once"
                }
              }

    - name: Configure virtual media (lenovo, redfish)
      when: bmc_type == "lenovo" and (virtual_media_method | default("rdmount")) == "redfish"
      block:
        - name: Eject existing virtual media
          delegate_to: localhost
          ansible.builtin.uri:
            url: "https://{{ bmc_addr }}/redfish/v1/Managers/1/VirtualMedia/EXT1"
            url_username: "{{ bmc_user }}"
            url_password: "{{ bmc_password }}"
            validate_certs: false
            force_basic_auth: true
            method: PATCH
            body_format: json
            body: |
              {
                "Image": null,
                "Inserted": false
              }
            status_code: [200, 204]
          failed_when: false

        - name: Mount boot image
          delegate_to: localhost
          ansible.builtin.uri:
            url: "https://{{ bmc_addr }}/redfish/v1/Managers/1/VirtualMedia/EXT1"
            url_username: "{{ bmc_user }}"
            url_password: "{{ bmc_password }}"
            validate_certs: false
            force_basic_auth: true
            method: PATCH
            body_format: json
            body: |
              {
                "Image": "{{ boot_image_url }}",
                "Inserted": true
              }

        - name: Request one-time boot from virtual media
          delegate_to: localhost
          ansible.builtin.uri:
            url: "https://{{ bmc_addr }}/redfish/v1/Systems/1"
            url_username: "{{ bmc_user }}"
            url_password: "{{ bmc_password }}"
            validate_certs: false
            force_basic_auth: true
            method: PATCH
            body_format: json
            body: |
              {
                "Boot": {
                  "BootSourceOverrideTarget": "Cd",
                  "BootSourceOverrideMode": "UEFI",
                  "BootSourceOverrideEnabled": "Once"
                }
              }
    - name: Power on node through OpenStack
      when: bm_management == "openstack"
      delegate_to: localhost
      ansible.builtin.command: >-
        openstack baremetal node power on {{ node_name }}

    - name: Power on node through the BMC (idrac)
      when: bm_management == "bmc" and bmc_type == "idrac"
      delegate_to: "{{ bmc_addr }}"
      ansible.builtin.raw: racadm serveraction powerup

    - name: Power on node through the BMC (lenovo)
      when: bm_management == "bmc" and bmc_type == "lenovo"
      delegate_to: "{{ bmc_addr }}"
      ansible.builtin.raw: power on
