# install_drive_serial/etcd_drive_wwn confirmed via
# `lsblk -o NAME,SIZE,SERIAL,WWN` against the live master nodes. etcd_drive_wwn
# is matched by hostname in 98-master-var-lib-etcd.j2, resolved via
# /dev/disk/by-id/wwn-<value>. etcd_drive_wwn MUST be quoted -- YAML parses an
# unquoted 0x... value as a hex integer, and Jinja renders it back in decimal.

